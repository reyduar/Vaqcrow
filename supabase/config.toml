# Hand-authored: the Supabase CLI is not installed in this environment, so
# this file was not generated by `supabase init`. It intentionally stays
# minimal — this change only needs local Postgres + the Data API for the
# application_review table (Auth/Storage/Edge Functions/Realtime are unused
# and disabled below). Regenerate/reconcile with `supabase init` once the
# CLI is available, to pick up the exact current CLI defaults.
project_id = "vaqcrow"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
# Enabled so the local stack issues the anon/publishable and service_role keys
# that `supabase status` exposes to scripts/env/generate-docker-env.sh. The
# demo does not use Supabase Auth itself (identity is simulated).
enabled = true

[storage]
enabled = false

[realtime]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
