# Hand-authored and intentionally minimal: local Postgres, the Data API and
# Supabase Auth (email + password, with email confirmation; #370). Storage,
# Edge Functions, Realtime and Analytics are unused and disabled below.
# Key names were checked against `supabase init` of CLI 2.117.
project_id = "vaqcrow"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

# Local email testing server (Mailpit). Auth emails (the signup confirmation
# link) are captured here and never sent: read them at http://127.0.0.1:54324.
# Resend is deliberately NOT configured locally; the remote project's SMTP is
# set in its dashboard (docs/architecture/environments.md §13.2).
[local_smtp]
enabled = true
port = 54324

[auth]
# Supabase Auth is the identity provider: PYME/INVERSOR sign up with email and
# password and must confirm their email (decision D1); ADMIN is only seeded
# (`seed:superadmin:docker`). The local stack also issues the anon/publishable
# and service_role keys that `supabase status` exposes to
# scripts/env/generate-docker-env.sh.
enabled = true
# The web app (`pnpm dev:web:docker`) runs on :3001; confirmation links return there.
site_url = "http://localhost:3001"
additional_redirect_urls = ["http://localhost:3001", "http://127.0.0.1:3001"]
enable_signup = true

[auth.email]
enable_signup = true
# Users must confirm their email before signing in. The seeded super admin is
# created with email_confirm = true, so it is not affected.
enable_confirmations = true

[storage]
enabled = false

[realtime]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
