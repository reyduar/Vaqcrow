<!doctype html>
<!--
  Swagger UI for the Vaqcrow API (Issue #487), served from GitHub Pages at
  /Vaqcrow/swagger/. It renders apps/api/openapi.json, which is generated from
  the route inventory + the shared Zod contracts and committed to the repo.

  The UI assets load from unpkg (a runtime, browser-only dependency of this
  published page; the CI job that stages it reaches no external service). See
  odd/tasks/openapi-swagger-spec.md for the tradeoff.
-->
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vaqcrow API — OpenAPI</title>
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css" />
  </head>
  <body>
    <div id="swagger-ui"></div>
    <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js" crossorigin></script>
    <script>
      window.ui = SwaggerUIBundle({
        url: "./openapi.json",
        dom_id: "#swagger-ui",
        deepLinking: true,
        displayRequestDuration: true
      });
    </script>
  </body>
</html>
