name: CI

# Pull-request verification only: every gate here runs against local fixtures,
# doubles and a local network. No job reaches Stellar Testnet, a remote Horizon,
# Supabase, or an LLM provider, and no repository secret is required.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates (lint, types, tests, build, boundaries)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.27.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # The documented single gate: lint + typecheck + test + build + boundaries.
      - name: Verify
        run: pnpm run verify

  e2e:
    name: Playwright (deterministic, local double)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.27.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm run test:e2e:install

      # Turbo builds `@vaqcrow/web`'s workspace dependencies first, then Playwright
      # starts the app and the local stub double. No external service is contacted.
      - name: Run Playwright tests
        run: pnpm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

  # The contracts are a Rust workspace outside the pnpm one, so turbo does not
  # build them and they get their own job. Everything runs against a local
  # network: Testnet is reserved for the demo evidence, never for a pull request.
  contracts:
    name: Contracts (build, test, deploy on a local network)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The pinned compiler and the Wasm target live in contracts/rust-toolchain.toml,
      # which is the source of truth for a local build. This step mirrors the same
      # version so CI does not depend on whatever the runner happens to ship, and
      # the step after it prints what actually resolved.
      #
      # No rustup bootstrap script here on purpose: this workflow must not
      # reference an external endpoint, and tests/testing-and-ci-gates.test.ts
      # enforces exactly that. The toolchain comes from an action instead.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          targets: wasm32v1-none

      - name: Install Stellar CLI
        uses: stellar/stellar-cli@v28.0.0

      # `testing` builds run with Testnet's resource limits, so what passes here
      # predicts Testnet without surprises. The action waits for the container to
      # report healthy before the next step runs.
      #
      # The image is pinned by digest on purpose (#619). `tag: testing` is
      # republished continuously, so it is not a version: the build published on
      # 2026-10-23 started rejecting `stellar contract upload` with
      # `HostError: Error(Context, InternalError)` while the contracts, the Stellar
      # CLI (28.0.0) and the network protocol (28) were unchanged — the same wasm
      # uploaded fine on the previous build. A digest cannot move, so this job now
      # fails only when our own code does.
      #
      # This digest is the `testing` build of 2026-09-16, the last one verified
      # end to end. To move it: run `campaign-smoke.sh` against the candidate
      # digest before touching this line and `local-network.sh`'s default.
      - name: Start a local Stellar network
        uses: stellar/quickstart@0ff76e336a438370ba900db7f437dcbe5b90dda7
        with:
          image: stellar/quickstart@sha256:042cdfe06bd60c42f0ba5310936b48a3efbd1d0a870ce0cb24f8e9e5964d8d98
          network: local
          enable: core,horizon,rpc

      - name: Resolve the pinned toolchain
        working-directory: contracts
        run: |
          rustup show
          rustc --version
          rustup target list --installed | grep wasm32v1-none

      - name: Register the local network
        run: ./contracts/scripts/local-network.sh network-add

      # The factory deploys by Wasm hash, so the vault's Wasm has to be really
      # uploaded before a campaign can be opened. That cannot be covered by unit
      # tests: this builds, tests, deploys both contracts and runs the campaign
      # flow end to end, asserting on what the network reports.
      #
      # Note: the vault's constructor takes (sme, token, goal, deadline), so a
      # bare `deploy-local.sh --goal=...` no longer works — the script forwards
      # whatever the caller gives it, and the CLI rejects a short argument list.
      - name: Run the campaign flow end to end
        run: ./contracts/scripts/campaign-smoke.sh
